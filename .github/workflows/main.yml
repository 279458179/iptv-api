name: 'Update schedule'

on:
  workflow_dispatch:
  schedule:
    # Runs every day at 02:00 Asia/Shanghai.
    - cron: '0 18 * * *'

permissions:
  contents: write

concurrency:
  group: iptv-update
  cancel-in-progress: true

jobs:
  push:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ 'ubuntu-latest' ]
    steps:
      - name: Set branch name
        id: vars
        run: echo "BRANCH_NAME=${{ github.repository_owner == 'Guovin' && 'gd' || 'master' }}" >> $GITHUB_ENV
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          persist-credentials: true
      - name: Run with setup-python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          update-environment: true
          cache: 'pipenv'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install pipenv
        run: pip3 install --user pipenv
      - name: Install dependencies
        run: pipenv --python 3.13 && pipenv install --deploy
      - name: Update
        run: pipenv run dev
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Github Action Auto Updated"
            git push origin HEAD:${{ env.BRANCH_NAME }}
          fi
      - name: Configure APTV sync key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.APTV_DINGYUE_DEPLOY_KEY }}" > ~/.ssh/aptv_dingyue
          chmod 600 ~/.ssh/aptv_dingyue
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/aptv_dingyue -o IdentitiesOnly=yes" >> $GITHUB_ENV
      - name: Sync output to APTV-dingyue
        env:
          APTV_SYNC_REPO: git@github.com:279458179/APTV-dingyue.git
          APTV_SYNC_BRANCH: main
          APTV_EPG_URL: https://raw.githubusercontent.com/279458179/APTV-dingyue/main/epg.gz
        run: bash scripts/sync-to-aptv.sh
